# Settings for this Pi.
# install.sh copies this to settings.toml, which is never changed by updates. 

# After editing settings.toml run 'sudo systemctl restart bbbb-display'


display = "full"            # "full" or "simple" for data heavy or poetry
nightly_update = true       # Update every night at 3am default
debug = false               # when true checks every second and redraw instantly


[full]
rotate = 0                  # 0, or 180 if the screen is upside down
# show_qr = false           # no QR codes on the browse pages
# min_refresh_seconds = 180 # shortest gap between redraws


[simple]
rotate = 90                 # 90 or 270, depending which way up the screen is mounted
# show_footer = false      # no IP address and update time along the bottom
# min_refresh_seconds = 180 # shortest gap between redraws
